<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>차세대경영자과정 지출 대시보드</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-orb orb-c"></div>

    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">INNOBIZ ACADEMY FINANCE MONITOR</p>
          <h1>4기 지출 대시보드</h1>
          <p class="hero-sub" id="meta-line">데이터 로딩 중...</p>
        </div>
        <div class="hero-right">
          <p class="mini-title">비교 기준</p>
          <p class="mini-value">전년도(3기) 동일 주차 대비</p>
          <p class="mini-title">데이터 갱신</p>
          <p class="mini-value">엑셀 수정 후 update_web_dashboard.bat 실행</p>
        </div>
      </header>

      <section class="kpi-grid" id="kpi-grid"></section>

      <section class="chart-grid">
        <article class="panel">
          <h2>주차별 지출 비교</h2>
          <canvas id="weeklyChart"></canvas>
        </article>
        <article class="panel">
          <h2>카테고리별 지출 구성 (4기)</h2>
          <canvas id="categoryChart"></canvas>
        </article>
      </section>

      <section class="chart-grid">
        <article class="panel">
          <h2>실수입 대비 지출 현황</h2>
          <canvas id="budgetChart"></canvas>
        </article>
        <article class="panel">
          <h2>주차별 출석률</h2>
          <canvas id="attendanceChart"></canvas>
        </article>
      </section>

      <section class="chart-grid">
        <article class="panel table-panel">
          <h2>주차별 상세 비교표</h2>
          <div class="table-wrap">
            <table id="weekly-table"></table>
          </div>
        </article>
        <article class="panel table-panel">
          <h2>출석률 점검(전체)</h2>
          <div class="table-wrap">
            <table id="attendance-table"></table>
          </div>
        </article>
      </section>

      <section class="panel table-panel">
        <h2>카테고리별 비교표</h2>
        <div class="table-wrap">
          <table id="category-table"></table>
        </div>
      </section>

      <section class="panel table-panel">
        <h2>실수입 대비 지출표</h2>
        <div class="table-wrap">
          <table id="budget-table"></table>
        </div>
      </section>

      <section class="panel table-panel">
        <h2>실수입내역</h2>
        <div class="table-wrap">
          <table id="income-table"></table>
        </div>
      </section>

      <section class="panel table-panel">
        <h2>4기 주요 지출 Top 15</h2>
        <div class="table-wrap">
          <table id="top-table"></table>
        </div>
      </section>
    </main>

    <div id="detail-modal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" id="modal-close-bg"></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-head">
          <h3 id="modal-title">상세내역</h3>
          <button id="modal-close-btn" class="modal-close-btn" type="button">닫기</button>
        </div>
        <div class="table-wrap modal-table-wrap">
          <table id="drilldown-table"></table>
        </div>
      </div>
    </div>

    <script src="./data/dashboard.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
